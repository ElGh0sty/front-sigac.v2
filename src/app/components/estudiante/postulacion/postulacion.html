<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-900">Postulación a Ayudantía</h2>
    <p class="text-slate-500 text-sm mt-1">Selecciona la cátedra a la que deseas postularte.</p>
  </div>

  <section class="glass-card rounded-2xl p-6 max-w-2xl">
    <!-- Success Alert -->
    <div *ngIf="successMessage" class="mb-5 p-3.5 bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm rounded-xl flex items-center gap-2.5">
      <i class="fa-solid fa-circle-check text-emerald-500"></i>
      <span>{{ successMessage }}</span>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage" class="mb-5 p-3.5 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl flex items-center gap-2.5">
      <i class="fa-solid fa-circle-exclamation text-red-500"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="enviarPostulacion()" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Cátedra (Materia)</label>
        <select [(ngModel)]="postulacion.catedraId" name="catedraId" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none text-slate-900">
          <option [value]="0">Selecciona una cátedra...</option>
          <option *ngFor="let c of catedras" [value]="c.id">{{ c.nombre }}</option>
        </select>
      </div>

      <button type="submit" [disabled]="isLoading" class="py-3 px-6 bg-accent hover:bg-accent-dim text-white font-bold rounded-xl shadow-lg shadow-accent/20 transition-all transform hover:-translate-y-0.5 disabled:opacity-50">
        {{ isLoading ? 'Enviando...' : 'Enviar Postulación' }}
      </button>
    </form>
  </section>

  <!-- Historial de Postulaciones -->
  <section *ngIf="historial.length > 0" class="glass-card rounded-2xl p-6 max-w-2xl">
    <h3 class="text-lg font-bold text-slate-900 mb-4">Mis Ayudantías</h3>
    <div class="space-y-3">
      <div *ngFor="let h of historial" class="p-4 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between">
        <div>
          <p class="font-bold text-slate-900">{{ h.nombreCatedra }}</p>
          <p class="text-xs text-slate-500">{{ h.semestreCatedra }} • Docente: {{ h.docenteCatedra }}</p>
        </div>
        <span class="px-3 py-1 text-xs font-semibold rounded-full"
          [ngClass]="{
            'bg-emerald-100 text-emerald-700': h.estadoAyudantia === 'Aprobada' || h.estadoAyudantia === 'Activa',
            'bg-amber-100 text-amber-700': h.estadoAyudantia === 'Pendiente',
            'bg-red-100 text-red-700': h.estadoAyudantia === 'Rechazada'
          }">
          {{ h.estadoAyudantia }}
        </span>
      </div>
    </div>
  </section>
</div>
