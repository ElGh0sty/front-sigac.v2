<aside class="w-full bg-white flex flex-col shrink-0 z-20 relative border-l border-slate-200">
  <div class="h-[72px] flex items-center px-6 shrink-0 border-b border-slate-200">
    <h2 class="text-sm font-semibold text-slate-900">Próximas Clases</h2>
  </div>
  <div class="flex-1 overflow-y-auto p-5 space-y-6">
    <div class="space-y-3">
      <div *ngFor="let clase of proximasClases" class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
        <p class="text-sm font-semibold text-slate-900">{{ clase.titulo }}</p>
        <p class="text-[11px] text-slate-500 mt-0.5">{{ clase.descripcion }}</p>
        <div class="flex items-center gap-2 mt-2 text-xs text-accent">
          <i class="fa-regular fa-clock"></i> {{ clase.fecha }}
        </div>
        <a routerLink="/docente/gestion-clases" class="text-xs text-slate-400 hover:text-accent mt-2 inline-block">Ir a Gestión de Clases →</a>
      </div>
    </div>
  </div>
</aside>
