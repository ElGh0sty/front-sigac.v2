<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-900">Gestión de Ayudantía</h2>
    <p class="text-slate-500 text-sm mt-1">Administra tu postulación, bitácora e informes desde un solo lugar.</p>
  </div>

  <div class="glass-card rounded-2xl overflow-hidden">
    <div class="flex border-b border-slate-200">
      <button (click)="tab = 'postulacion'" class="flex-1 py-3 text-sm font-medium transition-colors border-b-2" [ngClass]="tab === 'postulacion' ? 'border-accent text-accent' : 'border-transparent text-slate-500 hover:text-slate-900'">
        Postulación
      </button>
      <button (click)="tab = 'bitacora'" class="flex-1 py-3 text-sm font-medium transition-colors border-b-2" [ngClass]="tab === 'bitacora' ? 'border-accent text-accent' : 'border-transparent text-slate-500 hover:text-slate-900'">
        Bitácora
      </button>
      <button (click)="tab = 'informes'" class="flex-1 py-3 text-sm font-medium transition-colors border-b-2" [ngClass]="tab === 'informes' ? 'border-accent text-accent' : 'border-transparent text-slate-500 hover:text-slate-900'">
        Informes
      </button>
    </div>

    <div class="p-6">
      <!-- Contenido de Postulación -->
      <div *ngIf="tab === 'postulacion'">
        <app-postulacion></app-postulacion>
      </div>
      <!-- Contenido de Bitácora -->
      <div *ngIf="tab === 'bitacora'">
        <app-bitacora></app-bitacora>
      </div>
      <!-- Contenido de Informes -->
      <div *ngIf="tab === 'informes'">
        <app-informes></app-informes>
      </div>
    </div>
  </div>
</div>
