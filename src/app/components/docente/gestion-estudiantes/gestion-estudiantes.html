<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-900">Gestión de Estudiantes</h2>
    <p class="text-slate-500 text-sm mt-1">Añade estudiantes a una materia existente.</p>
  </div>

  <!-- Success Alert -->
  <div *ngIf="successMessage" class="p-3.5 bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm rounded-xl flex items-center gap-2.5">
    <i class="fa-solid fa-circle-check text-emerald-500"></i>
    <span>{{ successMessage }}</span>
  </div>

  <!-- Error Alert -->
  <div *ngIf="errorMessage" class="p-3.5 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl flex items-center gap-2.5">
    <i class="fa-solid fa-circle-exclamation text-red-500"></i>
    <span>{{ errorMessage }}</span>
  </div>

  <section class="glass-card rounded-2xl p-6 border border-slate-200">
    <!-- Selector de materia -->
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Selecciona una Materia</label>
      <select [(ngModel)]="materiaSeleccionadaId" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none bg-white">
        <option [value]="0">Selecciona una materia...</option>
        <option *ngFor="let m of materias" [value]="m.id">{{ m.nombre }} ({{ m.codigo || 'MAT' }})</option>
      </select>
    </div>

    <!-- Buscador de estudiantes -->
    <div class="flex items-end gap-2 mt-4">
      <div class="flex-1">
        <label class="block text-sm font-medium text-slate-700 mb-1">Buscar estudiante por correo</label>
        <input type="email" [(ngModel)]="correoBusqueda" name="correoBusqueda" (keyup.enter)="buscarYAgregarEstudiante()" placeholder="ej: estudiante@institucion.edu" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none bg-white" />
      </div>
      <button type="button" (click)="buscarYAgregarEstudiante()" class="py-2 px-4 bg-accent text-white rounded-lg hover:bg-accent-dim transition-colors">
        Añadir
      </button>
    </div>

    <!-- Lista de estudiantes seleccionados -->
    <div *ngIf="estudiantesSeleccionados.length > 0" class="border border-slate-200 rounded-lg p-3 mt-4">
      <p class="text-xs font-semibold text-slate-500 uppercase mb-2">Estudiantes añadidos ({{ estudiantesSeleccionados.length }}):</p>
      <div *ngFor="let e of estudiantesSeleccionados" class="flex items-center justify-between py-1 border-b border-slate-100 last:border-0">
        <div>
          <p class="text-sm font-medium text-slate-800">{{ e.nombre }}</p>
          <p class="text-xs text-slate-400">{{ e.correo }}</p>
        </div>
        <button type="button" (click)="eliminarEstudiante(e.id)" class="text-xs text-red-600 hover:text-red-800">
          Eliminar
        </button>
      </div>
    </div>

    <button (click)="guardarEstudiantes()" [disabled]="isLoading" class="mt-6 py-2.5 px-6 bg-accent hover:bg-accent-dim text-white font-medium rounded-lg transition-colors disabled:opacity-50">
      {{ isLoading ? 'Guardando...' : 'Guardar Estudiantes' }}
    </button>
  </section>
</div>
